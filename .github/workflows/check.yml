name: Workbench checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: curl --fail http://127.0.0.1:8765/api/projects/1/overview
      - run: |
          curl --fail --json '{"name":"Persistence check"}' http://127.0.0.1:8765/api/setup
          docker compose down
          docker compose up --wait
          curl --fail -s http://127.0.0.1:8765/api/projects | python -c "import json,sys; assert any(row['name']=='Persistence check' for row in json.load(sys.stdin))"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chrome
      - run: python tests/browser_acceptance.py

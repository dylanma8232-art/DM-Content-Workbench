<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连接抖音日报 · DM 工作台</title>
  <style>
    :root {
      --bg: #FAF8F4;
      --card: #FFFFFF;
      --subtle: #F3EFE8;
      --line: #E6DFD5;
      --t1: #1F1D1A;
      --t2: #524C44;
      --t3: #6C6358;
      --accent: #CC521B;
      --accent-solid: #C84F18;
      --accent-hover: #A83F10;
      --accent-bg: #FFF2E8;
      --accent-line: #EABFA4;
      --accent-ink: #8F3711;
      --flow-cyan: #0E8A8D;
      --flow-amber: #E27828;
    }
    * { box-sizing: border-box; }
    body {
      max-width: 580px;
      margin: 7vh auto;
      padding: 20px;
      font: 14.5px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      color: var(--t1);
      background:
        radial-gradient(60% 45% at 12% 0%, rgba(204, 82, 27, 0.08), transparent 70%),
        radial-gradient(50% 40% at 90% 5%, rgba(14, 138, 141, 0.07), transparent 70%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .connectShell {
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 12px 32px rgba(29, 22, 15, 0.07);
      overflow: hidden;
    }
    .deckHead {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      background: linear-gradient(135deg, #1D1A17 0%, #28221C 58%, #342419 100%);
      color: #FAF7F2;
    }
    .deckHead::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 2.5px;
      background: linear-gradient(90deg, transparent 0%, var(--flow-cyan) 22%, var(--flow-amber) 50%, var(--accent) 78%, transparent 100%);
    }
    .deckAvatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(234, 191, 164, 0.35);
      object-fit: cover;
      flex: none;
    }
    .deckSub {
      font-size: 11.5px;
      color: #D7C6B8;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .deckSub::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--flow-cyan);
      box-shadow: 0 0 0 3px rgba(14, 138, 141, 0.25);
    }
    h1 {
      margin: 2px 0 0;
      font-size: 21px;
      font-weight: 740;
      color: #FFFFFF;
      letter-spacing: -0.02em;
    }
    .connectBody {
      padding: 22px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    p { margin: 0; overflow-wrap: anywhere; }
    #scope {
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-line);
      color: var(--accent-ink);
      font-size: 13px;
      font-weight: 620;
    }
    #scope:empty { display: none; }
    .guideText { color: var(--t2); }
    a {
      color: var(--accent-ink);
      font-weight: 650;
      text-underline-offset: 3px;
    }
    a:hover { color: var(--accent-hover); }
    #message {
      padding: 12px 14px;
      border-radius: 11px;
      background: var(--subtle);
      border: 1px solid var(--line);
      color: var(--t1);
      white-space: pre-wrap;
      font-size: 13.5px;
      font-weight: 550;
    }
    #message:empty { display: none; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }
    button {
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--accent-solid);
      background: linear-gradient(135deg, var(--accent-solid), #B54212);
      color: #FFFFFF;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(200, 79, 24, 0.2);
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }
    button:hover:enabled {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    button:disabled {
      background: var(--subtle);
      border-color: var(--line);
      color: var(--t3);
      box-shadow: none;
      transform: none;
      cursor: default;
    }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
